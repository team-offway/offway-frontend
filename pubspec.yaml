name: offway
description: "A new Flutter project."
publish_to: 'none'
version: 0.1.0+5

environment:
  sdk: ^3.10.3

dependencies:
  dio: ^5.10.0
  flutter:
    sdk: flutter
  flutter_naver_map: ^1.4.4
  flutter_riverpod: ^3.3.2
  flutter_secure_storage: ^10.3.1
  flutter_svg: ^2.3.0
  freezed_annotation: ^3.1.0
  gal: ^2.3.2
  geolocator: ^14.0.2
  go_router: ^17.3.0
  intl: ^0.20.3
  json_annotation: ^4.9.0
  kakao_flutter_sdk_user: ^2.0.0+1
  sign_in_with_apple: ^7.0.1
  url_launcher: ^6.3.1

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0
  build_runner: ^2.15.1
  json_serializable: ^6.11.2
  freezed: ^3.2.3
  flutter_secure_storage_platform_interface: ^2.0.2
  flutter_launcher_icons: ^0.14.4

# 앱 아이콘 생성 설정. 원본(assets/icon/app_icon.png) 교체 후
# `dart run flutter_launcher_icons` 실행하면 iOS 아이콘 세트가 재생성된다.
flutter_launcher_icons:
  ios: true
  image_path: "assets/icon/app_icon.png"
  # iOS는 알파 채널이 있으면 App Store 업로드가 거부된다
  remove_alpha_ios: true

flutter:
  uses-material-design: true
  assets:
    - assets/icons/
    - assets/images/
    - assets/mock/

  # 디자인 시스템 본문 서체 (SIL OFL 1.1 · assets/fonts/LICENSE.txt)
  # 타이포 토큰이 쓰는 400·500·600·700만 포함한다
  fonts:
    - family: Pretendard
      fonts:
        - asset: assets/fonts/Pretendard-Regular.otf
          weight: 400
        - asset: assets/fonts/Pretendard-Medium.otf
          weight: 500
        - asset: assets/fonts/Pretendard-SemiBold.otf
          weight: 600
        - asset: assets/fonts/Pretendard-Bold.otf
          weight: 700
