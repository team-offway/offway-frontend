     못 뜨면 지도 자리는 회색으로 남고 목록은 그대로 보인다 -->
<script src="https://oapi.map.naver.com/openapi/v3/maps.js?ncpKeyId=qqdpbn2yp9"></script>

<style>
  /* 앱과 같은 디자인 토큰 */
  :root {
    --primary: #3DC2FF;
    --primary-strong: #00AEFF;
    --pink: #F553DA;
    /* 지도 마커 — 시안은 본문 primary와 다른 톤을 쓴다 */
    --marker: #18D2FE;

    --bg: #ffffff;
    --label-normal: #171719;
    --label-neutral: rgba(46, 47, 51, .88);
    --label-alt: rgba(55, 56, 60, .61);
    --line-neutral: rgba(112, 115, 124, .16);
    /* 점선은 더 진해야 보인다 — 앱 lineNormal(22%)과 맞춘다 */
    --line-dot: rgba(112, 115, 124, .38);
    --fill: rgba(112, 115, 124, .08);
    --inverse-label: #F7F7F8;

    --sans: "Pretendard", -apple-system, BlinkMacSystemFont,
            "Apple SD Gothic Neo", "Segoe UI", "Noto Sans KR", sans-serif;
  }

  * { box-sizing: border-box; }

  body {
    margin: 0;
    background: var(--bg);
    color: var(--label-normal);
    font-family: var(--sans);
    line-height: 1.5;
    -webkit-font-smoothing: antialiased;
    word-break: keep-all;
  }

  /* 시안이 1080 기준이라 모바일 폭에 맞춰 환산했다 */
  .page {
    position: relative;
    max-width: 420px; margin-inline: auto;
    /* 히어로는 1080:392 비율로 늘어난다 — 뒤로가기를 그 아래 놓는 기준 */
    --hero-h: min(36.3vw, 152px);
  }

  /* ── 히어로 ─────────────────────────── */
  .hero {
    background: var(--primary);
    line-height: 0;
  }
  .hero img { width: 100%; height: auto; display: block; }

  /* 뒤로가기는 앱에서만 보인다 — 없을 때도 히어로 아래 간격이 유지되도록
     여백은 .head가 갖고, 버튼은 그 자리에 겹쳐 올린다 */
  .back {
    position: absolute; top: calc(var(--hero-h) + 2px); left: 6px;
    display: flex; align-items: center; justify-content: center;
    width: 44px; height: 44px;
    border: 0; background: none; cursor: pointer;
    color: var(--label-alt);
  }
  .back svg { width: 24px; height: 24px; display: block; }
  .back:focus-visible { outline: 2px solid var(--primary); outline-offset: 2px; border-radius: 8px; }

  /* ── 제목 ───────────────────────────── */
  .head { padding: 40px 20px 0; text-align: center; }
  h1 {
    margin: 0;
    font-size: 22px; font-weight: 700;
    letter-spacing: -.03em; line-height: 1.33;
    text-wrap: balance;
  }
  h1 .accent { color: var(--primary); }
  .dates {
    margin: 8px 0 0;
    font-size: 15px; color: var(--label-alt);
    font-variant-numeric: tabular-nums;
  }

  /* 사용 연차·D-DAY 뱃지 — 시안은 primary 8% 배경에 primary 글자 */
  .badges {
    display: flex; flex-wrap: wrap; gap: 8px;
    justify-content: center;
    margin-top: 14px;
  }
  .badge {
    display: inline-flex; align-items: center; gap: 4px;
    padding: 5px 9px; border-radius: 8px;
    background: rgba(61, 194, 255, .08);
    color: var(--primary);
    font-size: 13px; font-weight: 600;
    letter-spacing: .019em;
    white-space: nowrap;
  }
  .badge svg { width: 15px; height: 15px; }

  /* ── 지도 ───────────────────────────── */
  .cover {
    margin: 28px 20px 0;
    border-radius: 12px; overflow: hidden;
    background: var(--fill);
  }
  /* 지도는 부모의 비율·절대위치에 기대지 않고 자기 높이를 직접 갖는다 —
     그렇게 해야 타일이 확실히 그려진다 (시안 925:495 ≒ 0.535) */
  #map {
    width: 100%;
    /* 좌우 여백 20씩을 뺀 폭의 53.5% — 화면이 넓어져도 비율이 유지된다.
       page 최대폭 420 기준 상한을 둔다 */
    height: min(53.5vw, 203px);
  }

  /* 지도 위 번호 마커 — 목록의 번호와 같은 모양이라 눈으로 이어진다 */
  /* 시안: 채운 원에 흰 숫자뿐 — 테두리도 그림자도 없다 (48:28 비율) */
  .pin {
    width: 28px; height: 28px; border-radius: 999px;
    background: var(--marker); color: #fff;
    display: grid; place-items: center;
    font-family: var(--sans);
    font-size: 16px; font-weight: 600;
    line-height: 1;
    font-variant-numeric: tabular-nums;
  }
  .pin[data-kind="STAY"] { background: var(--pink); }

  /* ── Day 탭 ─────────────────────────── */
  .days {
    display: flex; gap: 9px;
    padding: 20px 20px 0;
    overflow-x: auto;
    scrollbar-width: none;
  }
  .days::-webkit-scrollbar { display: none; }
  .days button {
    flex-shrink: 0;
    padding: 8px 13px; border-radius: 10px;
    font-family: inherit; font-size: 14px; font-weight: 500;
    letter-spacing: .01em;
    cursor: pointer;
    background: none;
    border: 1px solid var(--line-neutral);
    color: var(--label-alt);
    transition: background .15s, color .15s, border-color .15s;
  }
  .days button[aria-selected="true"] {
    background: var(--label-neutral);
    border-color: transparent;
    color: var(--inverse-label);
  }
  .days button:focus-visible { outline: 2px solid var(--primary); outline-offset: 2px; }

  /* 그 날이 며칠인지 — 탭과 달리 정보 표시라 누를 수 없다 */
  .day-head {
    display: flex; align-items: baseline; gap: 12px;
    padding: 20px 20px 0;
    font-size: 15px; font-weight: 600;
  }
  .day-head .date {
    color: var(--label-alt); font-weight: 500;
    font-variant-numeric: tabular-nums;
  }

  /* ── 장소 목록 ──────────────────────── */
  .places { padding: 8px 20px 0; }

  .place {
    display: grid;
    grid-template-columns: 24px 1fr 70px;
    gap: 14px;
    /* start 로 두면 번호 열이 제 높이로 줄어 점선이 몇 점만 찍힌다 —
       행 높이만큼 늘어나야 다음 번호까지 이어진다 */
    align-items: stretch;
  }
  /* 번호 열은 점선이 지나가므로 행 사이 여백을 여기서 만들지 않는다 */
  .place + .place { margin-top: 0; }

  .rail { position: relative; display: flex; justify-content: center; }
  .no {
    position: relative; z-index: 1;
    width: 24px; height: 24px; border-radius: 999px;
    background: var(--primary); color: #fff;
    display: grid; place-items: center;
    font-size: 14px; font-weight: 600;
    font-variant-numeric: tabular-nums;
    margin-top: 12px;
  }
  .no[data-kind="STAY"] { background: var(--pink); }
  /* 다음 번호까지 이어지는 점선 — 마지막 행에는 그리지 않는다 */
  /* 앱과 같은 점선 — 점(1.25) + 간격으로 4.5px 주기.
     CSS dashed 는 이 모양이 안 나와 배경 그라디언트로 찍는다 */
  .rail::after {
    content: "";
    /* 번호 원(top 12 + 지름 24) 바로 아래에서 시작해 행 끝까지 —
       거리 칩 구간의 선과 맞물려 1→2→3 이 통으로 이어진다 */
    position: absolute; top: 36px; bottom: 0; left: 50%;
    width: 1.25px;
    transform: translateX(-50%);
    background-image: linear-gradient(
      to bottom,
      var(--line-dot) 0 1.25px,
      transparent 1.25px 4.5px
    );
    background-size: 1.25px 4.5px;
    background-repeat: repeat-y;
  }
  /* 거리 칩이 형제로 끼어들어 :last-child 로는 마지막 장소를 못 집는다 —
     렌더할 때 표시해 둔 마지막 행에서만 선을 끊는다 */
  .place[data-last] .rail::after { display: none; }

  /* ── 이동 거리 칩 ───────────────────── */
  /* 앞 장소에서 여기까지의 거리. 점선 위에 흰 배경으로 얹혀 선을 끊는다.
     내 코스에만 있다 — 추천 코스는 아직 어떻게 갈지 정해지지 않았다 */
  .gap {
    display: grid;
    grid-template-columns: 24px 1fr 70px;
    gap: 14px;
  }
  /* 점선이 지나가는 첫 열 위에 칩을 겹쳐 올린다 */
  .gap .rail { position: relative; }
  .gap .rail::after {
    content: "";
    position: absolute; top: 0; bottom: 0; left: 50%;
    width: 1.25px;
    transform: translateX(-50%);
    background-image: linear-gradient(
      to bottom,
      var(--line-dot) 0 1.25px,
      transparent 1.25px 4.5px
    );
    background-size: 1.25px 4.5px;
    background-repeat: repeat-y;
  }
  .km {
    position: relative; z-index: 1;
    justify-self: start; align-self: center;
    /* 점선을 가운데로 지나가게 두되 칩은 24px 열 폭에 갇히지 않는다 */
    grid-column: 1 / 3;
    margin-left: -12px;
    padding: 5px 10px;
    border: 1px solid var(--line-neutral);
    border-radius: 8px;
    background: var(--bg);
    font-size: 12px; color: var(--label-alt);
    font-variant-numeric: tabular-nums;
    white-space: nowrap;
  }

  .info { padding: 12px 0; min-width: 0; }
  .name {
    margin: 0;
    font-size: 16px; font-weight: 600;
    letter-spacing: .014em;
    overflow-wrap: anywhere;
  }
  .why {
    margin: 4px 0 0;
    font-size: 14px; color: var(--label-neutral);
    letter-spacing: .014em;
  }
  .why b { color: var(--primary-strong); font-weight: 500; }
  .cat {
    display: flex; gap: 12px;
    margin: 4px 0 0;
    font-size: 13px; color: var(--label-alt);
    letter-spacing: .019em;
  }
  /* 여행 당일 휴무·운영시간 주의 — 시안은 이 자리를 빨갛게 띄운다 */
  .cat .warn { color: #FF4242; }

  .thumb {
    width: 70px; height: 70px; margin-top: 12px;
    border-radius: 12px; overflow: hidden;
    background: var(--fill);
    display: grid; place-items: center;
  }
  .thumb img { width: 100%; height: 100%; object-fit: cover; display: block; }
  /* 앱의 자리 아이콘 색(labelDisable — #37383C 16%)과 맞춘다 */
  .thumb .ph { width: 24px; height: 24px; color: rgba(55, 56, 60, 0.16); }

  /* ── 상태 ───────────────────────────── */
  .state {
    padding: 80px 24px; text-align: center; color: var(--label-alt);
  }
  .state p { margin: 0; font-size: 15px; }

  /* ── 푸터 ───────────────────────────── */
  footer {
    padding: 46px 20px 40px;
    text-align: center;
  }
  footer p { margin: 0; font-size: 14px; color: var(--label-alt); }
  footer .mark {
    margin-top: 5px;
    font-size: 19px; font-weight: 800; letter-spacing: .01em;
    color: var(--primary);
  }

  [hidden] { display: none !important; }
</style>
</head>
<body>

<div class="page">

  <div class="hero">
    <img src="/assets/hero.png" alt="" width="1080" height="392">
  </div>

  <!-- 웹에서는 돌아갈 곳이 없어 가린다. 앱이 웹뷰로 띄울 때만 ?app=1로 켠다 -->
  <button type="button" class="back" id="back" aria-label="뒤로 가기" hidden>
    <svg viewBox="0 0 24 24" fill="none" aria-hidden="true">
      <path d="M15 19L8 12l7-7" stroke="currentColor" stroke-width="2"
            stroke-linecap="round" stroke-linejoin="round"/>
    </svg>
  </button>

  <main id="main" hidden>
    <div class="head">
      <h1 id="title"></h1>
      <p class="dates" id="dates"></p>
      <div class="badges" id="badges"></div>
    </div>

    <div class="cover" id="cover"><div id="map"></div></div>

    <!-- 당일치기는 하루뿐이라 탭을 그리지 않는다 -->
    <div class="days" id="days" role="tablist" aria-label="여행 일자" hidden></div>

    <div class="day-head" id="day-head"></div>
    <div class="places" id="places"></div>
  </main>

  <div class="state" id="state"><p>코스를 불러오는 중이에요</p></div>

  <footer>
    <p>연차로 떠나는 로컬 여행</p>
    <p class="mark">offway</p>
  </footer>

</div>

<script>
  (function () {
    var PLACEHOLDER =
      // 앱의 빈 사진 자리와 같은 DS 이미지 아이콘 (assets/icons/ic_image.svg)
      '<svg class="ph" viewBox="0 0 20 20" fill="none" aria-hidden="true">' +
      '<path fill-rule="evenodd" clip-rule="evenodd" fill="currentColor" d="M5.2915 7.29077C5.2915 6.1862 6.18693 5.29077 7.29149 5.29077C8.39606 5.29077 9.29148 6.1862 9.29148 7.29077C9.29148 8.39534 8.39606 9.29077 7.29149 9.29077C6.18693 9.29077 5.2915 8.39534 5.2915 7.29077ZM7.29149 6.79077C7.01535 6.79077 6.79149 7.01463 6.79149 7.29077C6.79149 7.56691 7.01535 7.79077 7.29149 7.79077C7.56763 7.79077 7.79149 7.56691 7.79149 7.29077C7.79149 7.01463 7.56763 6.79077 7.29149 6.79077Z"/>' +
      '<path fill-rule="evenodd" clip-rule="evenodd" fill="currentColor" d="M6.88518 2.16626C6.21183 2.16625 5.66109 2.16624 5.21354 2.20281C4.75028 2.24066 4.33188 2.32139 3.94114 2.52049C3.32962 2.83208 2.83243 3.32926 2.52085 3.94079C2.32175 4.33153 2.24102 4.74993 2.20317 5.21319C2.1666 5.66075 2.16661 6.21145 2.16662 6.88482V13.1143C2.16661 13.7877 2.1666 14.3384 2.20317 14.786C2.24102 15.2493 2.32175 15.6677 2.52085 16.0584C2.83243 16.6699 3.32962 17.1671 3.94114 17.4787C4.33188 17.6778 4.75028 17.7585 5.21354 17.7964C5.6611 17.8329 6.21181 17.8329 6.88518 17.8329H13.1147C13.788 17.8329 14.3387 17.8329 14.7863 17.7964C15.2496 17.7585 15.668 17.6778 16.0587 17.4787C16.6702 17.1671 17.1674 16.6699 17.479 16.0584C17.6781 15.6677 17.7588 15.2493 17.7967 14.786C17.8332 14.3384 17.8332 13.7877 17.8332 13.1143V6.88484C17.8332 6.21146 17.8332 5.66075 17.7967 5.21319C17.7588 4.74993 17.6781 4.33153 17.479 3.94079C17.1674 3.32926 16.6702 2.83208 16.0587 2.52049C15.668 2.32139 15.2496 2.24066 14.7863 2.20281C14.3388 2.16624 13.7881 2.16625 13.1147 2.16626H6.88518ZM4.62213 3.857C4.76616 3.78361 4.96519 3.7281 5.33568 3.69783C5.71494 3.66684 6.20416 3.66626 6.9166 3.66626H13.0832C13.7957 3.66626 14.2849 3.66684 14.6642 3.69783C15.0347 3.7281 15.2337 3.78361 15.3777 3.857C15.707 4.02478 15.9747 4.29249 16.1425 4.62178C16.2159 4.76581 16.2714 4.96484 16.3017 5.33534C16.3327 5.71459 16.3332 6.20382 16.3332 6.91626V9.0228L16.1449 8.83443C15.8327 8.5222 15.5668 8.25632 15.3307 8.05588C15.0826 7.8453 14.8185 7.66324 14.4966 7.55864C14.0112 7.40093 13.4884 7.40093 13.003 7.55864C12.6811 7.66324 12.4169 7.8453 12.1689 8.05588C11.9328 8.25631 11.6669 8.52216 11.3547 8.83438L4.27762 15.9115C4.10497 15.7635 3.9618 15.5824 3.85735 15.3774C3.78396 15.2334 3.72845 15.0343 3.69818 14.6638C3.6672 14.2846 3.66661 13.7954 3.66661 13.0829V6.91626C3.66661 6.20382 3.6672 5.71459 3.69818 5.33534C3.72845 4.96484 3.78396 4.76581 3.85735 4.62178C4.02513 4.29249 4.29284 4.02478 4.62213 3.857ZM5.98201 16.3285C6.24509 16.3328 6.55154 16.3329 6.9166 16.3329H13.0832C13.7957 16.3329 14.2849 16.3323 14.6642 16.3014C15.0347 16.2711 15.2337 16.2156 15.3777 16.1422C15.707 15.9744 15.9747 15.7067 16.1425 15.3774C16.2159 15.2334 16.2714 15.0343 16.3017 14.6638C16.3327 14.2846 16.3332 13.7954 16.3332 13.0829V11.1441L15.1051 9.91595C14.7663 9.57718 14.5437 9.35542 14.3599 9.19938C14.1828 9.04904 14.0917 9.00426 14.033 8.98522C13.8489 8.9254 13.6506 8.9254 13.4665 8.98522C13.4079 9.00426 13.3167 9.04904 13.1396 9.19939C12.9559 9.35542 12.7333 9.57718 12.3945 9.91595L5.98201 16.3285Z"/>' +
      '</svg>';

    var main = document.getElementById('main');
    var state = document.getElementById('state');
    var daysEl = document.getElementById('days');
    var placesEl = document.getElementById('places');
    // 사진 주소가 죽어 있으면 그 칸을 자리 아이콘으로 바꾼다 — 앱의
    // errorBuilder와 같은 동작. error는 버블링하지 않아 캡처로 받는다
    placesEl.addEventListener('error', function (e) {
      if (e.target && e.target.tagName === 'IMG') e.target.outerHTML = PLACEHOLDER;
    }, true);

    // 앱이 웹뷰로 띄울 때만 뒤로가기를 보여준다 (?app=1)
    var backBtn = document.getElementById('back');
    if (new URLSearchParams(location.search).get('app') === '1') {
      backBtn.hidden = false;
      backBtn.addEventListener('click', function () {
        if (history.length > 1) history.back();
        else location.href = '/';
      });
    }

    function show(msg) {
      state.innerHTML = '<p>' + msg + '</p>';
      state.hidden = false;
      main.hidden = true;
    }

    /// 연차 일수 표기 — 앱의 formatLeaveDays와 같은 규칙.
    /// 정수는 '2', 반차는 '0.5', 반반차는 '0.25'. 자릿수를 고정하면
    /// 0.25가 '0.3'이 되어 앱과 어긋난다
    function formatLeaveDays(days) {
      if (days === Math.round(days)) return String(Math.round(days));
      return days.toFixed(2).replace(/0+$/, '').replace(/\.$/, '');
    }

    function durationLabel(days) {
      if (days <= 1) return '당일치기';
      return (days - 1) + '박' + days + '일';
    }

    function esc(s) {
      return String(s == null ? '' : s).replace(/[&<>"']/g, function (c) {
        return { '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c];
      });
    }

    var map = null;
    var markers = [];
    var pathLine = null;
    // 카테고리가 빈 장소는 지역명을 대신 보여준다 (앱과 같은 규칙)
    var region = '';

    /// 그 날의 장소를 지도에 찍는다. 스크립트가 못 뜨면 회색 자리로 남긴다.
    function drawMap(items) {
      // 지도 스크립트가 늦게 뜨거나 못 뜰 수 있다 — 늦으면 한 번 더 기다린다
      if (!window.naver || !naver.maps) {
        if (!drawMap.retried) {
          drawMap.retried = true;
          window.addEventListener('load', function () {
            drawMap.retried = false;
            drawMap(items);
          });
        }
        return;
      }

      var pts = items
        .filter(function (it) { return it.lat != null && it.lng != null; })
        .map(function (it, i) {
          return { pos: new naver.maps.LatLng(it.lat, it.lng), no: i + 1, kind: it.kind };
        });
      if (!pts.length) return;

      try {

      if (!map) {
        map = new naver.maps.Map('map', {
          center: pts[0].pos,
          zoom: 11,
          // 공유 페이지는 훑어보는 화면이라 조작 UI를 걷어낸다
          mapDataControl: false,
          scaleControl: false,
        });
      }

      markers.forEach(function (m) { m.setMap(null); });
      if (pathLine) pathLine.setMap(null);

      // 1→2→3 순서대로 잇는 점선. 실제 도로가 아니라 순서를 보이는 선이다
      if (pts.length >= 2) {
        pathLine = new naver.maps.Polyline({
          map: map,
          path: pts.map(function (p) { return p.pos; }),
          strokeColor: '#878A93',
          // 앱과 같은 굵기 — 4는 점이 아니라 굵은 띠로 보였다
          strokeWeight: 3,
          strokeStyle: 'shortdot',
          strokeLineCap: 'round',
          strokeOpacity: 1,
        });
      }
      markers = pts.map(function (p) {
        return new naver.maps.Marker({
          position: p.pos,
          map: map,
          icon: {
            content: '<div class="pin" data-kind="' + esc(p.kind) + '">' + p.no + '</div>',
            anchor: new naver.maps.Point(14, 14),
          },
        });
      });

      // 전체를 담되 첫 장소를 가운데 둔다 — 코스는 1번에서 시작한다
      if (pts.length >= 2) {
        var b = new naver.maps.LatLngBounds();
        pts.forEach(function (p) { b.extend(p.pos); });
        map.fitBounds(b, { top: 40, right: 40, bottom: 40, left: 40 });
      }
      map.setCenter(pts[0].pos);
      } catch (e) {
        // 지도가 못 떠도 목록은 보여야 한다. 대신 원인은 남긴다
        console.error('지도를 그리지 못했습니다:', e);
      }
    }

    var WEEK = { MONDAY: '월', TUESDAY: '화', WEDNESDAY: '수', THURSDAY: '목',
                 FRIDAY: '금', SATURDAY: '토', SUNDAY: '일' };

    /// '7.26 월' — 서버가 요일을 주므로 날짜에서 다시 계산하지 않는다
    function dayLabel(day) {
      if (!day || !day.date) return '';
      var p = day.date.split('-');
      var md = Number(p[1]) + '.' + Number(p[2]);
      var w = WEEK[day.dayOfWeek];
      return w ? md + ' ' + w : md;
    }

    var CLOCK =
      '<svg viewBox="0 0 24 24" fill="none" aria-hidden="true">' +
      '<circle cx="12" cy="12" r="9" stroke="currentColor" stroke-width="1.8"/>' +
      '<path d="M12 7v5l3 2" stroke="currentColor" stroke-width="1.8" ' +
      'stroke-linecap="round" stroke-linejoin="round"/></svg>';

    /// 첫 뱃지에만 시계 아이콘을 단다 (시안: 사용 연차 뱃지)
    function renderBadges(list, withClock) {
      document.getElementById('badges').innerHTML = list.map(function (t, i) {
        var icon = (withClock && i === 0) ? CLOCK : '';
        return '<span class="badge">' + icon + esc(t) + '</span>';
      }).join('');
    }

    function renderDay(day) {
      var items = (day && day.items) || [];
      drawMap(items);

      // 앱의 공유 코스 화면과 같은 'Day 1  7.26 월'
      document.getElementById('day-head').innerHTML = day
        ? '<span>Day ' + (day.day || 1) + '</span>' +
          '<span class="date">' + esc(dayLabel(day)) + '</span>'
        : '';
      if (!items.length) {
        placesEl.innerHTML = '<p class="state">이 날의 일정이 아직 없어요</p>';
        return;
      }
      placesEl.innerHTML = items.map(function (it, i) {
        var thumb = it.imageUrl
          ? '<img src="' + esc(it.imageUrl) + '" alt="" loading="lazy">'
          : PLACEHOLDER;
        var why = it.catchphrase
          ? '<p class="why"><b>추천</b> ' + esc(it.catchphrase) + '</p>' : '';
        // 카테고리 옆에 그날 주의할 운영 정보를 붙인다 (서버가 줄 때만)
        var notes = '';
        if (it.closedToday) notes = '<span class="warn">휴무일</span>';
        else if (it.checkHours) notes = '<span class="warn">운영시간 확인</span>';
        // 카테고리가 비면 지역명을 대신 쓴다 — 줄이 통째로 비지 않게
        var catText = it.categoryLabel || region;
        var cat = (catText || notes)
          ? '<p class="cat"><span>' + esc(catText) + '</span>' + notes + '</p>' : '';
        // 앞 장소에서 여기까지의 거리 — 첫 장소에는 없다
        var km = '';
        if (i > 0 && it.distanceFromPrevMeters != null) {
          km = '<div class="gap"><div class="rail"></div>' +
               '<div class="km">' + (it.distanceFromPrevMeters / 1000).toFixed(1) + 'km</div>' +
               '</div>';
        }
        var last = (i === items.length - 1) ? ' data-last' : '';
        return km + '<div class="place"' + last + '>' +
          '<div class="rail"><div class="no" data-kind="' + esc(it.kind) + '">' + (i + 1) + '</div></div>' +
          '<div class="info"><p class="name">' + esc(it.title) + '</p>' + why + cat + '</div>' +
          '<div class="thumb">' + thumb + '</div>' +
        '</div>';
      }).join('');
    }

    function render(course) {
      var days = course.days || [];
      var travelDays = course.travelDays || days.length || 1;

      // 지역 이름은 코스 응답 상위에 없어 첫 장소에서 가져온다
      region = '';
      days.some(function (d) {
        return (d.items || []).some(function (it) {
          if (it.regionName) { region = it.regionName; return true; }
          return false;
        });
      });
      // 시안: "정선여행, 당일치기" — 기간만 브랜드색
      document.getElementById('title').innerHTML =
        esc((region || '') + '여행, ') +
        '<span class="accent">' + esc(durationLabel(travelDays)) + '</span>';

      // 여행 날짜 — 하루면 하나, 여러 날이면 시작-끝
      var first = days[0] && days[0].date;
      var last = days[days.length - 1] && days[days.length - 1].date;
      var dateText = '';
      if (first) {
        var a = first.split('-');
        dateText = a[0] + '.' + Number(a[1]) + '.' + Number(a[2]);
        if (last && last !== first) {
          var b = last.split('-');
          dateText += ' - ' + Number(b[1]) + '.' + Number(b[2]);
        }
      }
      document.getElementById('dates').textContent = dateText;

      // D-DAY 뱃지 — 여행 시작일 기준. 지난 여행에는 붙이지 않는다
      var badges = [];
      if (first) {
        var today = new Date(); today.setHours(0, 0, 0, 0);
        var start = new Date(first + 'T00:00:00');
        var diff = Math.round((start - today) / 86400000);
        // 앱과 같은 규칙 — 지난 여행도 상태를 알려 준다
        if (diff === 0) badges.push('D-DAY');
        else if (diff > 0) badges.push('D-' + diff);
        else badges.push('여행완료');
      }
      renderBadges(badges);

      // 사용 연차는 응답에 없어 날짜로 서버에 계산을 맡긴다 — 늦게 와도
      // 화면은 이미 떠 있고 뱃지만 나중에 붙는다
      if (first && last) {
        fetch('/api/leave?start=' + encodeURIComponent(first) +
              '&end=' + encodeURIComponent(last))
          .then(function (r) { return r.ok ? r.json() : null; })
          .then(function (body) {
            var n = body && body.data && body.data.consumedLeaveDays;
            if (n == null) return;
            renderBadges(
              ['사용 연차 일수 ' + formatLeaveDays(n) + '일'].concat(badges),
              true
            );
          })
          .catch(function () { /* 못 받아도 D-DAY 뱃지는 그대로 */ });
      }

      // 하루짜리 코스에는 탭이 필요 없다
      if (days.length > 1) {
        daysEl.hidden = false;
        daysEl.innerHTML = days.map(function (d, i) {
          return '<button type="button" role="tab" data-i="' + i + '" ' +
                 'aria-selected="' + (i === 0) + '">Day ' + (d.day || i + 1) + '</button>';
        }).join('');
        daysEl.addEventListener('click', function (e) {
          var btn = e.target.closest('button');
          if (!btn) return;
          daysEl.querySelectorAll('button').forEach(function (b) {
            b.setAttribute('aria-selected', String(b === btn));
          });
          renderDay(days[Number(btn.dataset.i)]);
        });
      }

      state.hidden = true;
      main.hidden = false;
      // hidden을 푼 직후에는 아직 레이아웃이 잡히지 않아 지도가 크기를 0으로
      // 읽는다 — 다음 프레임에 그려야 타일이 나온다
      requestAnimationFrame(function () {
        renderDay(days[0]);
      });
    }

    // 주소는 /r/{shareToken} — 마지막 조각이 토큰이다
    var token = location.pathname.split('/').filter(Boolean).pop();
    if (!token || token === 'recommend.html') {
      show('링크가 올바르지 않아요');
      return;
    }

    fetch('/api/course?token=' + encodeURIComponent(token))
      .then(function (res) {
        return res.json().then(function (body) {
          return { status: res.status, body: body };
        });
      })
      .then(function (r) {
        if (r.status === 404) return show('링크가 잘못되었거나 삭제된 코스예요');
        if (r.status === 410) return show('만료된 링크예요');
        if (r.status >= 400 || !r.body || !r.body.data) {
          return show((r.body && r.body.detail) || '코스를 불러오지 못했어요');
        }
        render(r.body.data);
      })
      .catch(function () {
        show('코스를 불러오지 못했어요');
      });
  })();
</script>
